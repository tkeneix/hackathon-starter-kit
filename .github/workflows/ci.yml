# CI: PR ごとにマージ前ゲートとテストを実行する。
# ジョブ名 "gate" は tools/bin/flow.sh protect のブランチ保護で必須チェックとして参照している。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # merge-base 計算のため履歴全体が必要

      - name: マージ前ゲート（syntax / secret / envfile / largefile）
        run: python3 tools/bin/flow_gate.py --repo-root . --base-ref "origin/${{ github.base_ref || 'main' }}"

      - name: shellcheck
        run: shellcheck -S warning tools/bin/flow.sh tools/git-hooks/*

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 依存関係
        run: uv sync --locked

      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .

      - name: pytest
        run: uv run pytest
